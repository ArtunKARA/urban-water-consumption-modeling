[project]
name = "urban-water-cli"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["urban-water-core", "urban-water-simulator"]

[project.scripts]
uw = "urban_water_cli.main:main"

[tool.uv.sources]
urban-water-core = { workspace = true }
urban-water-simulator = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urban_water_cli"]
