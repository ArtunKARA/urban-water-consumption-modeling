[project]
name = "urban-water-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "urban-water-contracts", "psycopg[binary]>=3.2,<4", "pyarrow>=18,<24",
  "tzdata>=2025.1", "python-dotenv>=1,<2",
]

[tool.uv.sources]
urban-water-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urban_water"]
