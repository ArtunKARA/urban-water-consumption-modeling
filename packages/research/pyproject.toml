[project]
name = "urban-water-research"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "urban-water-core", "scikit-learn>=1.7,<2", "matplotlib>=3.10,<4",
]

[tool.uv.sources]
urban-water-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urban_water_research"]
